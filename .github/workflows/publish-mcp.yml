name: Publish to npm & MCP Registry

on:
  push:
    tags: ["v*"] # Triggers on version tags like v1.0.0

permissions:
  id-token: write # Required for OIDC (both npm trusted publishing and MCP Registry)
  contents: write # Required for `gh release create`

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      ### Build & test ###

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24" # npm 11.5.1+ required for trusted publishing
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      ### Publish to npm (trusted publishing via OIDC — no NPM_TOKEN needed) ###

      - name: Publish package to npm
        run: |
          # Idempotent, so the job can be re-run if a later step fails
          VERSION=${GITHUB_REF#refs/tags/v}
          if npm view "universal-screenshot-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "universal-screenshot-mcp@$VERSION is already on npm; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Wait for npm to serve the new version
        run: |
          # The MCP Registry validates that the npm version exists, and a fresh
          # publish can take a few minutes to become visible (v1.5.0 failed here).
          VERSION=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            if npm view "universal-screenshot-mcp@$VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "npm is serving $VERSION"
              exit 0
            fi
            echo "Waiting for npm to serve $VERSION ($i/30)..."
            sleep 10
          done
          echo "::error::npm did not serve $VERSION within 5 minutes"
          exit 1

      ### Publish to MCP Registry ###

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json from git tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      ### Create GitHub Release ###

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Idempotent, so the job can be re-run if a later step fails
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping"
            exit 0
          fi
          awk -v ver="$VERSION" '
            /^## \[/ { if (in_section) exit; if ($0 ~ "^## \\[" ver "\\]") { in_section=1; next } }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
